[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cemdisp"
version = "0.1.0"
description = "Cement-slurry displacement efficiency modeling scaffold"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Sisyphus scaffold" }
]
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["cemdisp*"]

[tool.pytest.ini_options]
# 测试分层后固定默认收集范围（tests/contract = 契约测试，tests/history = 历史锁定测试）。
# 不加 testpaths 时，裸 `pytest` 会递归到 scripts/probes/ 与 archive/ 下的
# test_*.py 探针脚本（当前恰好不产生用例，但属隐式依赖）。
testpaths = ["tests"]
